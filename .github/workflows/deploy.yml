name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            if [ ! -d ~/portfolio ]; then
              echo "❌ Repo not found at ~/portfolio"
              echo "   Run on VPS first: bash scripts/setup-vps.sh"
              exit 1
            fi
            cd ~/portfolio

            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/

            bash scripts/deploy.sh
