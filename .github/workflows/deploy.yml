name: Deploy to VPS

# ─────────────────────────────────────────────────────────────────────────────
# Build-on-runner deploy (sprint-12).
#
# The VPS (~2 GB RAM) is too small to compile a Next.js + PayloadCMS build — it
# OOM'd and locked us out (see docs/sprint-11/rca/2026-07-19-deploy-build-oom-lockout.md).
# So we build on the GitHub runner (~7 GB RAM) and rsync finished artifacts to
# the VPS, which only does `npm ci --omit=dev` + `pm2 restart`. No compile on the
# VPS → OOM is impossible.
#
# Design + concepts: docs/sprint-12/resources/architecture.md
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   VPS_HOST    — server IP
#   VPS_USER    — root  (the repo lives at /root/portfolio; PM2/nginx run as root)
#   VPS_SSH_KEY — private key whose public half is in /root/.ssh/authorized_keys
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout + Node setup ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── 2. Build BACKEND on the runner (RAM is plentiful here — no OOM) ────
      #    payload.config.ts gives every env var a build-time default, so the
      #    build needs NO secrets. The real PAYLOAD_SECRET + payload.db stay
      #    on the VPS only.
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build          # → backend/.next/

      # ── 3. Build FRONTEND on the runner ────────────────────────────────────
      - name: Build frontend
        working-directory: frontend
        env:
          # The frontend runs as SSR on the VPS and calls the backend on the
          # SAME box, so localhost:3000 is correct for server-side fetches.
          PUBLIC_API_URL: http://localhost:3000/api
        run: |
          npm ci
          npm run build          # → frontend/dist/

      # ── 4. Configure the SSH key on the runner so rsync can reach the VPS ─
      - name: Configure SSH for rsync
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH configured for ${{ secrets.VPS_HOST }}"

      # ── 5. Sync backend artifacts to the VPS ──────────────────────────────
      #    --delete keeps the VPS tidy. Excluded files are PROTECTED from
      #    deletion by plain --delete (only --delete-excluded would remove them),
      #    so backend/.env, backend/payload.db, and the Payload upload dirs are
      #    safe. DO NOT add --delete-excluded. See architecture.md §7.4 / §7.5.
      - name: Sync backend to VPS
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'payload.db' \
            --exclude 'payload.db.*' \
            --exclude '*.bak' \
            --exclude 'portfolio-data-*.zip' \
            --exclude 'portfolio-snapshot-*.zip' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude '/documents' \
            --exclude '/media' \
            --exclude '/uploads' \
            --exclude '/tmp' \
            backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/portfolio/backend/

      # ── 6. Sync frontend artifacts to the VPS ─────────────────────────────
      - name: Sync frontend to VPS
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            frontend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/portfolio/frontend/

      # ── 7. Install runtime deps + restart PM2 on the VPS (no compile) ─────
      - name: Restart services on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /root/portfolio
            bash scripts/deploy.sh
