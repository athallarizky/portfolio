name: Deploy to VPS

# ─────────────────────────────────────────────────────────────────────────────
# Build-on-runner deploy (sprint-12; resurrected sprint-29).
#
# The VPS (~2 GB RAM) is too small to compile a Next.js + PayloadCMS build — it
# OOM'd and locked us out (see docs/sprint-11/rca/2026-07-19-deploy-build-oom-lockout.md).
# So we build on the GitHub runner (~7 GB RAM) and rsync finished artifacts to the
# VPS, which only does `npm ci --omit=dev` + `pm2 restart`. No compile on the
# VPS → OOM is impossible.
#
# Sprint-29: target is the NEW Tencent box — `ubuntu` user, /home/ubuntu/portfolio.
# The frontend builds with DEPLOY_TARGET=vps → @astrojs/node standalone (the
# astro.config.mjs env-switch); PUBLIC_API_URL is inlined at build time here, so
# it must be set in THIS workflow, not on the box.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   VPS_HOST    — server IP (43.173.26.154)
#   VPS_USER    — ubuntu
#   VPS_SSH_KEY — private key whose public half is in /home/ubuntu/.ssh/authorized_keys
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout + Node setup ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── 2. Build BACKEND on the runner (RAM is plentiful here — no OOM) ────
      #    payload.config.ts gives every env var a build-time default, so the
      #    build needs NO secrets. The real PAYLOAD_SECRET + Neon/R2 env stay
      #    on the VPS only.
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build          # → backend/.next/

      # ── 3. Build FRONTEND on the runner (VPS target) ───────────────────────
      - name: Build frontend (VPS target)
        working-directory: frontend
        env:
          DEPLOY_TARGET: vps
          PUBLIC_API_URL: https://api.athallarizky.com/api
        run: |
          npm ci
          npm run build          # → frontend/dist/ (node standalone)

      # ── 4. Configure the SSH key on the runner so rsync can reach the VPS ─
      - name: Configure SSH for rsync
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH configured for ${{ secrets.VPS_HOST }}"

      # ── 5. Sync backend artifacts to the VPS ──────────────────────────────
      #    --delete keeps the VPS tidy. Excluded files are PROTECTED from
      #    deletion by plain --delete (only --delete-excluded would remove them),
      #    so backend/.env on the box is safe. DO NOT add --delete-excluded.
      #    '/documents' is disk-served uploads (the Resume) — box-persistent
      #    like .env; a deploy once wiped it (2026-11-03). Media is NOT here:
      #    it lives in R2 via the storage plugin.
      - name: Sync backend to VPS
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '*.bak' \
            --exclude 'portfolio-data-*.zip' \
            --exclude 'portfolio-snapshot-*.zip' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude '/documents' \
            backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/portfolio/backend/

      # ── 6. Sync frontend artifacts to the VPS ─────────────────────────────
      - name: Sync frontend to VPS
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            frontend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/portfolio/frontend/

      # ── 6b. Sync ops scripts to the VPS ───────────────────────────────────
      # scripts/deploy.sh EXECUTES on the VPS (step 7) — it must be the git
      # version (sprint-27 found the box serving a stale script copy once).
      - name: Sync ops scripts to VPS
        run: |
          rsync -az scripts/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/portfolio/scripts/

      # ── 6c. Sync root files to the VPS ────────────────────────────────────
      # ecosystem.config.cjs is PM2's process list and lives at the repo root —
      # the old box got it from a one-time git clone and it went stale forever.
      # The box never clones GitHub; everything arrives via deploy.
      - name: Sync root files to VPS
        run: |
          rsync -az ecosystem.config.cjs ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/portfolio/

      # ── 7. Install runtime deps + restart PM2 on the VPS (no compile) ─────
      - name: Restart services on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /home/ubuntu/portfolio
            bash scripts/deploy.sh
