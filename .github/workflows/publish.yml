name: Publish Content

# ─────────────────────────────────────────────────────────────────────────────
# Content publish pipeline (sprint-23) — GitHub is the source of truth.
#
# Called by publish-article.yml / publish-project.yml. Runs ENTIRELY on the
# GitHub runner — the VPS only receives an authenticated HTTPS call to its
# existing /api/data-import endpoint (same path as the admin UI). Nothing
# executes on the box.
#
# Flow:
#   1. Build the publish zip from git: wrap:publish --articles|--projects
#      bundles ALL rows of that collection from tools/ + the refs manifest
#      (tools/content/refs/ — refresh with `npm run refs:export`).
#   2. scripts/publish-content.mjs logs in with the service account and POSTs
#      the zip with replaceOnly=<collection> — scoped replace-all: the target
#      collection converges 1:1 with git (absent rows are deleted); refs
#      (tags/technologies) upsert only.
#
# ⚠️ Contract: articles/projects are authored via the git pipeline
# (tools/article-polish + tools/repo-to-project → commit). Drafts created
# directly in the prod admin will be deleted by the next publish.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   PUBLISH_EMAIL    — Payload service-account email
#   PUBLISH_PASSWORD — Payload service-account password
#   PUBLISH_BASE     — optional env override (defaults to https://athallarizky.com)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      collection:
        description: 'Target collection: articles | projects'
        required: true
        type: string
      dry_run:
        description: 'Preview the report without writing'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build publish zip from git sources
        working-directory: backend
        run: |
          npm ci
          npm run wrap:publish -- --${{ inputs.collection }} -- --out ../publish.zip

      - name: Import directly into Neon + R2 (runner-direct)
        # Sprint-27: serverless caps (4.5 MB body, 300 s duration, Hobby-locked iad1
        # region) make the API path unusable for media-heavy zips. The runner runs the
        # data-sync engine itself, straight against Neon + R2 — no function involved.
        # (The API path still exists for the admin UI and manual/laptop publishes:
        # scripts/publish-content.mjs + /api/data-import[-r2].)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        working-directory: backend
        run: |
          FLAGS=""
          [ "$DRY_RUN" = "true" ] && FLAGS="--dry-run"
          npx tsx src/data-sync/cli/import.ts ../publish.zip --replace-only ${{ inputs.collection }} $FLAGS
