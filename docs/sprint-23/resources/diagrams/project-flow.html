<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project flow · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f5f4;
      --color-ink:     #1f1e1c;
      --color-muted:   #615d59;
      --color-soft:    #8a847e;
      --color-accent:  #c35af7;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Content Pipeline · Sprint 23</p>
    <h1>Project flow — local repo to production</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pf-title pf-desc">
      <title id="pf-title">Project flow — local repo to production</title>
      <desc id="pf-desc">Swimlane diagram of the project pipeline: the author points at a local git repo, the AI agent runs repo-to-project to produce project.md and project.json, changes land in git through a PR (source of truth), the GitHub runner bundles all projects plus the refs manifest with wrap:publish on manual dispatch, and posts the zip over HTTPS to the production import endpoint, which converges the projects collection one-to-one with git via upsert and drift deletion.</desc>
      <defs>
        <marker id="pf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#615d59"/></marker>
        <marker id="pf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c35af7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f5f4"/>

      <!-- Lane dividers -->
      <line x1="40" y1="40" x2="920" y2="40" stroke="rgba(31,30,28,0.22)" stroke-width="1"/>
      <line x1="40" y1="140" x2="920" y2="140" stroke="rgba(31,30,28,0.10)" stroke-width="1"/>
      <line x1="40" y1="240" x2="920" y2="240" stroke="rgba(31,30,28,0.10)" stroke-width="1"/>
      <line x1="40" y1="340" x2="920" y2="340" stroke="rgba(31,30,28,0.10)" stroke-width="1"/>
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(31,30,28,0.10)" stroke-width="1"/>
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(31,30,28,0.22)" stroke-width="1"/>

      <!-- Actor column divider -->
      <line x1="140" y1="40" x2="140" y2="540" stroke="rgba(31,30,28,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="52" y="72" fill="#615d59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AUTHOR · LOCAL</text>
      <text x="52" y="172" fill="#615d59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AI AGENT · LOCAL</text>
      <text x="52" y="272" fill="#615d59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GITHUB</text>
      <text x="52" y="372" fill="#615d59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ACTIONS RUNNER</text>
      <text x="52" y="472" fill="#615d59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PROD · VPS</text>

      <!-- Annotation callout (editorial aside) -->
      <g>
        <rect x="560" y="64" width="336" height="76" fill="none" stroke="rgba(31,30,28,0.20)" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
        <text x="576" y="90" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#615d59">techTags resolve from the refs</text>
        <text x="576" y="108" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#615d59">manifest — npm run refs:export.</text>
      </g>

      <!-- Arrows -->
      <line x1="296" y1="112" x2="300" y2="164" stroke="#615d59" stroke-width="1.2" marker-end="url(#pf-arrow)"/>
      <line x1="448" y1="212" x2="452" y2="264" stroke="#615d59" stroke-width="1.2" marker-end="url(#pf-arrow)"/>
      <line x1="600" y1="312" x2="604" y2="364" stroke="#615d59" stroke-width="1.2" marker-end="url(#pf-arrow)"/>
      <line x1="752" y1="412" x2="756" y2="464" stroke="#c35af7" stroke-width="1.2" marker-end="url(#pf-arrow-accent)"/>

      <!-- Arrow labels -->
      <text x="292" y="134" text-anchor="end" fill="#8a847e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">repo path</text>
      <text x="444" y="234" text-anchor="end" fill="#8a847e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">artifacts</text>
      <text x="596" y="334" text-anchor="end" fill="#8a847e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">manual dispatch</text>
      <text x="600" y="446" fill="#c35af7" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS · replaceOnly=projects</text>

      <!-- Nodes -->
      <g>
        <rect x="148" y="64" width="148" height="48" fill="#ffffff" stroke="#1f1e1c" stroke-width="1" rx="6"/>
        <text x="160" y="86" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#1f1e1c">Point at repo</text>
        <text x="160" y="102" font-family="'Geist Mono', monospace" font-size="9" fill="#8a847e">~/development/&lt;repo&gt;</text>
      </g>
      <g>
        <rect x="300" y="164" width="148" height="48" fill="#ffffff" stroke="#1f1e1c" stroke-width="1" rx="6"/>
        <text x="312" y="186" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#1f1e1c">repo-to-project</text>
        <text x="312" y="202" font-family="'Geist Mono', monospace" font-size="9" fill="#8a847e">project.md · .json</text>
      </g>
      <g>
        <rect x="452" y="264" width="148" height="48" fill="rgba(195,90,247,0.08)" stroke="#c35af7" stroke-width="1.2" rx="6"/>
        <text x="464" y="286" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#1f1e1c">Commit → PR → merge</text>
        <text x="464" y="302" font-family="'Geist Mono', monospace" font-size="9" fill="#8a847e">git = source of truth</text>
      </g>
      <g>
        <rect x="604" y="364" width="148" height="48" fill="#ffffff" stroke="#1f1e1c" stroke-width="1" rx="6"/>
        <text x="616" y="386" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#1f1e1c">Publish Project</text>
        <text x="616" y="402" font-family="'Geist Mono', monospace" font-size="9" fill="#8a847e">wrap → zip → POST</text>
      </g>
      <g>
        <rect x="756" y="464" width="148" height="48" fill="rgba(31,30,28,0.05)" stroke="#615d59" stroke-width="1" rx="6"/>
        <text x="768" y="486" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#1f1e1c">Import engine → 1:1</text>
        <text x="768" y="502" font-family="'Geist Mono', monospace" font-size="9" fill="#8a847e">upsert + drift-delete</text>
      </g>

      <!-- Legend strip -->
      <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(31,30,28,0.12)" stroke-width="1"/>
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#615d59" letter-spacing="0.06em">
        <rect x="148" y="566" width="12" height="12" fill="rgba(195,90,247,0.08)" stroke="#c35af7" stroke-width="1.2" rx="2"/>
        <text x="168" y="576">source of truth</text>
        <rect x="292" y="566" width="12" height="12" fill="#ffffff" stroke="#1f1e1c" stroke-width="1" rx="2"/>
        <text x="312" y="576">step</text>
        <rect x="384" y="566" width="12" height="12" fill="rgba(31,30,28,0.05)" stroke="#615d59" stroke-width="1" rx="2"/>
        <text x="404" y="576">prod DB</text>
        <line x1="492" y1="572" x2="516" y2="572" stroke="#c35af7" stroke-width="1.2" marker-end="url(#pf-arrow-accent)"/>
        <text x="524" y="576">publish handoff (HTTPS)</text>
        <text x="904" y="576" text-anchor="end" fill="#8a847e">scoped replace-all · sprint-23</text>
      </g>
    </svg>
  </div>
</body>
</html>
