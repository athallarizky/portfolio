# Nginx reverse proxy for athallarizky.com — sprint-29 two-vhost layout
#
# VPS era 2 (sprint-29): preserves the sprint-27 subdomain contract —
#   athallarizky.com / www → Astro frontend (:4321, proxy_cache 60 s — the ISR replacement, plan.md D2)
#   api.athallarizky.com  → Payload backend (:3000, uncached, 100 MB upload limit)
#   vps.athallarizky.com  → frontend alias; sprint-29 TLS proving ground pre-cutover
#
# certbot --nginx upgrades the port-80 blocks below into the 443/SSL form at
# phase 2.6 (vps.) and phase 3.2 (real domains). No 443 blocks are hand-written.

# Cache zone (http context — sites-enabled files are included inside http{}).
# TTL-only 60 s: a publish is visible within a minute, no purge webhook (D2).
# POST is never cached (proxy_cache_methods defaults to GET/HEAD).
proxy_cache_path /var/cache/nginx/portfolio levels=1:2 keys_zone=portfolio:10m
                 max_size=100m inactive=10m use_temp_path=off;

# ── Frontend vhost ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name athallarizky.com www.athallarizky.com;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache portfolio;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }
}

# ── API vhost — Payload REST + admin panel ──────────────────────────────────
# Uncached by design: admin reads and publish-path GETs need live Neon data.
server {
    listen 80;
    listen [::]:80;
    server_name api.athallarizky.com;

    # Publish zips carry multi-MB project screenshots (sprint-27 413 lesson).
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── vps.athallarizky.com — TLS proving ground (phase 2.6) + permanent alias ─
# Uncached: this host exists for pinned-IP debugging; freshness beats speed here.
server {
    listen 80;
    listen [::]:80;
    server_name vps.athallarizky.com;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
